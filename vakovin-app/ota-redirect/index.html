<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaKoViN ist umgezogen</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9eef5; color: #1f2937; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 22rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: 0 0 1.25rem; line-height: 1.5; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.5rem; border-radius: 999px; background: #1c69d4; color: #fff; font-weight: 600; text-decoration: none; margin-bottom: .75rem; }
    a.quiet { background: transparent; color: #1c69d4; }
    a:focus-visible { outline: 3px solid #0f2a45; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>VaKoViN ist umgezogen</h1>
    <p>Diese Version wird nicht mehr unterstützt. Die neue VaKoViN-App hat eine Anmeldung und ist abgesichert.</p>
    <a href="https://vakovin.lovable.app">Zur neuen App</a><br>
    <a class="quiet" href="https://github.com/maxim7578/Maximilian/releases/download/vakovin-latest/VaKoViN.apk">Neue APK herunterladen</a>
  </main>
  <script>
    // Dem Updater melden, dass dieses Paket sauber startet (sonst Rückfall auf die alte Version).
    try { window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorUpdater && window.Capacitor.Plugins.CapacitorUpdater.notifyAppReady(); } catch (e) {}
  </script>
</body>
</html>
