<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VaKoViN</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9eef5; color: #1f2937; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 22rem; padding: 2rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .75rem; }
    p { margin: 0 0 1.5rem; line-height: 1.5; }
    button { min-height: 48px; padding: 0 1.5rem; border: 0; border-radius: 999px; background: #1c69d4; color: #fff; font-size: 1rem; font-weight: 600; }
    button:focus-visible { outline: 3px solid #0f2a45; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Keine Verbindung</h1>
    <p>VaKoViN braucht eine Internetverbindung. Prüfe WLAN oder mobile Daten und versuche es erneut.</p>
    <button type="button" onclick="location.href='https://vakovin.lovable.app'">Erneut versuchen</button>
  </main>
</body>
</html>
