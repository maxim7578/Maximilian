; Test-Telefonanlage, die eine FRITZ!Box nachahmt (nur für Tests)
[transport-udp]
type = transport
protocol = udp
bind = 127.0.0.1:5070

[kiassistent]
type = endpoint
context = von-ki
disallow = all
allow = alaw,ulaw
auth = kiassistent
aors = kiassistent
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes

[kiassistent]
type = auth
auth_type = userpass
username = kiassistent
password = Test123

[kiassistent]
type = aor
max_contacts = 1
remove_existing = yes
