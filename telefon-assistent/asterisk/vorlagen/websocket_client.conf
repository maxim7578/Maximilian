; Verbindung von Asterisk zum Gesprächsserver des Assistenten

[ki_raus]
type = websocket_client
uri = ws://127.0.0.1:{{APP_PORT}}/ws/raus
protocols = media
connection_type = per_call_config
connection_timeout = 500
reconnect_interval = 100
reconnect_attempts = 3
tls_enabled = no

[ki_rein]
type = websocket_client
uri = ws://127.0.0.1:{{APP_PORT}}/ws/rein
protocols = media
connection_type = per_call_config
connection_timeout = 500
reconnect_interval = 100
reconnect_attempts = 3
tls_enabled = no
