; Wählplan (erzeugt aus .env – nicht von Hand ändern)

[ki-raus]
; Ausgehender Anruf wurde angenommen: Gespräch an die KI übergeben.
exten => s,1,NoOp(KI-Anruf angenommen: Auftrag ${KI_AUFTRAG})
 same => n,Set(__KI_AUFTRAG=${KI_AUFTRAG})
 same => n,Dial(WebSocket/ki_raus/c(slin))
 same => n,Hangup()

[von-fritzbox]
; Eingehende Anrufe von der FRITZ!Box
exten => _X.,1,Goto(eingehend,s,1)
exten => _[a-zA-Z].,1,Goto(eingehend,s,1)
exten => s,1,Goto(eingehend,s,1)

[eingehend]
exten => s,1,NoOp(Eingehender Anruf von ${CALLERID(num)})
 same => n,GotoIf($["{{EINGEHEND}}" = "an"]?annehmen)
 ; Annehmen ist ausgeschaltet: nur "klingeln", damit deine anderen Telefone normal funktionieren.
 same => n,Ringing()
 same => n,Wait(600)
 same => n,Hangup()
 same => n(annehmen),Set(__ANRUFER=${CALLERID(num)})
 same => n,Dial(WebSocket/ki_rein/c(slin))
 same => n,Hangup()
