; Anmeldung als IP-Telefon an der FRITZ!Box (erzeugt aus .env – nicht von Hand ändern)

[global]
type = global
user_agent = KI-Telefonassistent

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:{{SIP_PORT}}

[fritzbox-auth]
type = auth
auth_type = userpass
username = {{FRITZBOX_BENUTZER}}
password = {{FRITZBOX_KENNWORT}}

[fritzbox-anmeldung]
type = registration
transport = transport-udp
outbound_auth = fritzbox-auth
server_uri = sip:{{FRITZBOX_ADRESSE}}
client_uri = sip:{{FRITZBOX_BENUTZER}}@{{FRITZBOX_ADRESSE}}
contact_user = {{FRITZBOX_BENUTZER}}
retry_interval = 30
forbidden_retry_interval = 300
expiration = 300

[fritzbox]
type = aor
contact = sip:{{FRITZBOX_ADRESSE}}

[fritzbox]
type = endpoint
transport = transport-udp
context = von-fritzbox
disallow = all
allow = alaw,ulaw
outbound_auth = fritzbox-auth
aors = fritzbox
from_user = {{FRITZBOX_BENUTZER}}
from_domain = {{FRITZBOX_ADRESSE}}
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733

[fritzbox-erkennung]
type = identify
endpoint = fritzbox
match = {{FRITZBOX_ADRESSE}}
