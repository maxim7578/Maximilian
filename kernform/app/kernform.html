<title>Kernform</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200..600&display=swap">
<style>
/* Layout: eine Handy-App in einer Spalte (max. 440px), Glasflächen über echten Trainingsfotos, schwebende Navigation unten. */
:root{
  --bg:#0F1012;
  --bg-hi:#34383C;
  --ink:#F2F2EF;
  --ink-2:rgba(242,242,239,.7);
  --ink-3:rgba(242,242,239,.5);
  --glass:rgba(255,255,255,.07);
  --glass-2:rgba(255,255,255,.12);
  --glass-3:rgba(255,255,255,.2);
  --glass-dark:rgba(18,19,21,.55);
  --line:rgba(255,255,255,.14);
  --pill:#F2F2EF;
  --pill-ink:#141516;
  --halo:#FBF3E6;
  --shade:rgba(0,0,0,.3);
  --font:'Geist','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:
    radial-gradient(120% 55% at 50% -12%, var(--bg-hi) 0%, transparent 62%),
    radial-gradient(90% 60% at 110% 110%, #22262B 0%, transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font);
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--halo);outline-offset:3px}
.app{max-width:440px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 128px;display:flex;flex-direction:column;gap:22px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 48px rgba(0,0,0,.28)}
.glass.dark{background:var(--glass-dark)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.muted{color:var(--ink-2)}
.small{font-size:13px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
.title-xl{font-size:34px;font-weight:300;letter-spacing:-.02em;line-height:1.05}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:14px;white-space:nowrap;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink);border-color:transparent}
.chip.sm{min-height:36px;padding:0 16px;font-size:13px}
.rbtn{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:var(--glass-2);display:grid;place-items:center;flex-shrink:0;transition:background .2s,transform .15s;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.rbtn:hover{background:var(--glass-3)}
.rbtn:active{transform:scale(.95)}
.rbtn[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.rbtn.sm{width:44px;height:44px}
.rbtn.xl{width:78px;height:78px}
.rbtn.solid{background:var(--pill);color:var(--pill-ink);border-color:transparent}
.rlabel{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.toggle{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 14px;border-radius:999px;border:1px solid var(--line);background:var(--shade);font-size:13px;font-weight:500;letter-spacing:.04em}
.toggle .knob{width:28px;height:28px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:grid;place-items:center}
.toggle[aria-pressed="false"] .knob{background:var(--glass-3);color:var(--ink)}
.big{font-weight:200;font-size:84px;line-height:.9;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;justify-content:center;gap:26px}
.stepper .rbtn{width:42px;height:42px;background:var(--shade)}
.stepper .cap{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{min-height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--pill);color:var(--pill-ink);font-weight:500;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.fill{fill:currentColor;stroke:none}

/* Foto-Animation: Start- und Endposition blenden ineinander */
.anim{position:relative;display:block;overflow:hidden;background:#1B1C1F}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.anim .b{opacity:0;animation:swap var(--d,2.4s) ease-in-out infinite}
.anim.mir img{transform:scaleX(-1)}
.anim.paused .b{animation-play-state:paused}
.anim.frame0 .b{animation:none;opacity:0}
.anim.frame1 .b{animation:none;opacity:1}
@keyframes swap{0%,28%{opacity:0}46%,78%{opacity:1}96%,100%{opacity:0}}
.ph{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass-dark);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ph span{padding:5px 10px;border-radius:999px;font-size:12px}
.ph .p0{animation:ph0 var(--d,2.4s) ease-in-out infinite}
.ph .p1{animation:ph1 var(--d,2.4s) ease-in-out infinite}
@keyframes ph0{0%,28%,96%,100%{background:var(--pill);color:var(--pill-ink)}46%,78%{background:transparent;color:var(--ink)}}
@keyframes ph1{0%,28%,96%,100%{background:transparent;color:var(--ink)}46%,78%{background:var(--pill);color:var(--pill-ink)}}
.paused .ph span,.ph.paused span{animation-play-state:paused}
.ph.static span{animation:none}
.ph.static .on{background:var(--pill);color:var(--pill-ink)}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.02em}

/* Heute-Karte */
.today{padding:22px;display:flex;flex-direction:column;gap:22px}
.round-row{display:flex;justify-content:space-between;gap:8px}

/* Programme */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{position:relative;min-height:220px;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:#1B1C1F;text-align:left;padding:0;display:block}
.pcard .anim{position:absolute;inset:0}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,transparent 30%,rgba(10,10,12,.85) 100%);pointer-events:none}
.pcard .tag{position:absolute;top:12px;left:12px;z-index:2;min-height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);display:inline-flex;align-items:center;font-size:12px}
.pcard .go{position:absolute;top:12px;right:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.16);border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.pcard .meta{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px}
.pcard .meta b{font-weight:500;font-size:15px}

/* Liste */
.search{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 18px;border-radius:999px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.search input::placeholder{color:var(--ink-3)}
.letter{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;padding:10px 4px 6px;font-size:13px;font-weight:500;color:var(--ink-2);background:linear-gradient(180deg,var(--bg) 60%,transparent)}
.item{width:100%;display:flex;align-items:center;gap:14px;padding:8px 30px 8px 8px;border-radius:22px;border:1px solid transparent;background:transparent;text-align:left;transition:background .2s}
.item:hover{background:var(--glass)}
.thumb{width:96px;height:68px;flex-shrink:0;border-radius:16px;border:1px solid var(--line)}
.item .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item .t b{font-weight:500;font-size:15px}
.lvl{display:inline-flex;gap:3px;vertical-align:middle}
.lvl i{width:5px;height:12px;border-radius:2px;background:var(--glass-3)}
.lvl i.on{background:var(--ink)}
.az{position:fixed;right:max(4px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:1px;z-index:6}
.az button{border:0;background:transparent;font-size:11px;color:var(--ink-2);min-width:24px;min-height:17px;padding:0}
.az button:hover{color:var(--ink)}

/* Detail */
.hero{position:relative;margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));aspect-ratio:4/3.3;max-width:calc(100% + 32px)}
.hero .anim{position:absolute;inset:0}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,transparent 26%,transparent 58%,var(--bg) 100%);pointer-events:none}
.hero .bar{position:absolute;top:16px;left:16px;right:16px;z-index:2;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.hero .bar .c{text-align:center;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hero .phwrap{position:absolute;left:0;right:0;bottom:62px;z-index:2;display:flex;justify-content:center}
.panel{position:relative;z-index:2;padding:22px;display:flex;flex-direction:column;gap:22px}
.panel.up{margin-top:-52px}
.section{display:flex;flex-direction:column;gap:12px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;line-height:1.5;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--glass-2);border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{padding:14px;border-radius:18px;background:var(--shade);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.warn{margin:0;padding-left:18px;color:var(--ink-2);line-height:1.6}

/* Player */
.player{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 60% at 50% -10%,#3A3E43 0%,transparent 60%),var(--bg);overflow-y:auto}
.player .app{padding-bottom:40px}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--glass-3)}
.segs i.done{background:var(--ink)}
.segs i.now{background:linear-gradient(90deg,var(--ink) var(--p,0%),var(--glass-3) var(--p,0%))}
.pstage{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:3/2;border:1px solid var(--line)}
.pstage .anim{position:absolute;inset:0}
.pstage .phwrap{position:absolute;left:12px;bottom:12px;z-index:2}
.pstage .rest{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(10,10,12,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.timer{position:relative;width:200px;height:200px;margin:0 auto}
.timer svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ctrl{display:flex;align-items:center;justify-content:center;gap:22px}
.next{padding:10px;display:flex;align-items:center;gap:14px;border-radius:22px}

/* Navigation */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;gap:4px;padding:6px;border-radius:999px}
.nav button{min-width:48px;height:48px;border-radius:999px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;color:var(--ink-2)}
.nav button[aria-current="page"]{background:var(--glass-3);color:var(--ink)}
.nav button span{display:none;font-size:14px}
.nav button[aria-current="page"] span{display:inline}

/* Onboarding */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(8,9,10,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;overflow-y:auto}
.sheet .inner{width:100%;max-width:440px;box-sizing:border-box;margin-top:40px;padding:26px max(18px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-radius:32px 32px 0 0;display:flex;flex-direction:column;gap:20px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pair .anim{aspect-ratio:3/2;border-radius:20px;border:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:999px;background:var(--shade);border:1px solid var(--line)}
.seg button{min-height:42px;border:0;border-radius:999px;background:transparent;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--pill);color:var(--pill-ink)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:16px 12px;border-radius:22px;display:flex;flex-direction:column;gap:6px}
.stat b{font-weight:200;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--ink-2);line-height:1.6;margin:0}
.credit{font-size:12px;color:var(--ink-3);line-height:1.6;margin:0}
.credit a{color:var(--ink-2)}
/* Coach */
.coach{position:relative;border-radius:30px;overflow:hidden;aspect-ratio:4/4.6;max-width:100%;border:1px solid var(--line);background:#1B1C1F}
.coach img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.coach::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,transparent 40%,rgba(10,10,12,.92) 100%);pointer-events:none}
.coach .over{position:absolute;left:20px;right:20px;bottom:20px;z-index:2;display:flex;flex-direction:column;gap:8px}
/* Lebendige Coach-Bilder: Kamerafahrt, Atmen, wanderndes Licht */
.coach img,.who img{transform-origin:50% 100%;animation:kb 18s ease-in-out infinite alternate,breathe 4.8s ease-in-out infinite}
.who button:not([aria-pressed="true"]) img{animation-duration:26s,4.8s;filter:saturate(.75) brightness(.8);transition:filter .4s}
.coach::before,.who button::before{content:"";position:absolute;inset:-20% -60%;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,244,226,.22) 50%,transparent 60%);mix-blend-mode:screen;animation:sweep 7.5s ease-in-out infinite}
.who button::before{animation-delay:1.8s}
.coach .over{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes kb{0%{scale:1.02;translate:0 0}100%{scale:1.11;translate:-1.6% -2.4%}}
@keyframes breathe{0%,100%{transform:scaleY(1) scaleX(1)}45%{transform:scaleY(1.012) scaleX(1.004)}}
@keyframes sweep{0%,18%{transform:translateX(-55%)}62%,100%{transform:translateX(55%)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.coach .chip{position:absolute;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.face{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);overflow:hidden;padding:0;background:#1B1C1F;flex-shrink:0}
.face img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.who button{position:relative;padding:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#1B1C1F;aspect-ratio:3/4}
.who img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.who span{position:absolute;left:10px;right:10px;bottom:10px;min-height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--glass-dark);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:14px}
.who button[aria-pressed="true"]{border-color:var(--pill);box-shadow:0 0 0 2px var(--pill)}
.who button[aria-pressed="true"] span{background:var(--pill);color:var(--pill-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important}
  .anim .b{animation:none;opacity:0}
  .anim.frame1 .b{opacity:1}
  .ph span{animation:none!important}
  .coach img,.who img,.coach::before,.who button::before,.coach .over{animation:none!important}
}
</style>

<div id="root"></div>

<script>
(function(){
'use strict';

/* ---------- Speicher (nur dieser Browser) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('kernform:' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('kernform:' + k, JSON.stringify(v)); } catch(e){} }
};
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* ---------- Übungen von A bis Z (Fotos: Free Exercise DB, gemeinfrei) ---------- */
const ZONES = { oben:'Oberer Bauch', unten:'Unterer Bauch', seite:'Seitlicher Bauch', tief:'Tiefe Mitte' };
const LEVELS = ['Anfänger', 'Fortgeschritten', 'Profi'];
const M = 'Matte';
const X = [
  ['Ab_Roller','Ab Roller','Bauchroller','tief',3,'reps',8,'Bauchroller',1500,
    ['Knie hüftbreit auf die Matte, die Hände greifen den Roller unter den Schultern.','Bauch fest anspannen und den Roller langsam nach vorn rollen, bis der Körper fast gestreckt ist.','Mit der Kraft aus dem Bauch zurückrollen, ohne ins Hohlkreuz zu fallen.'],
    ['Hohlkreuz in der gestreckten Position','Weiter rollen, als die Kraft reicht']],
  ['3_4_Sit-Up','Dreiviertel-Sit-up','3/4 Sit-Up','oben',1,'reps',15,M,1200,
    ['Rückenlage, Knie gebeugt, die Hände liegen hinter dem Kopf.','Den Oberkörper etwa drei Viertel des Weges aufrichten.','Langsam zurück, ohne die Schultern ganz abzulegen.'],
    ['Am Kopf ziehen','Mit Schwung hochreißen']],
  ['Air_Bike','Fahrrad-Crunch','Air Bike','seite',1,'reps',20,M,900,
    ['Rückenlage, Hände am Kopf, Schultern leicht angehoben, Knie über der Hüfte.','Den rechten Ellbogen zum linken Knie drehen und das rechte Bein strecken.','Fließend die Seite wechseln, wie beim Radfahren.'],
    ['Nur die Ellbogen bewegen','Am Nacken ziehen']],
  ['Alternate_Heel_Touchers','Fersen tippen','Alternate Heel Touchers','seite',1,'reps',20,M,800,
    ['Rückenlage, Füße aufgestellt, die Schultern leicht angehoben.','Seitlich zur rechten Ferse greifen.','Dann zur linken Ferse, die Schultern bleiben oben.'],
    ['Schultern ablegen','Mit dem Nacken ziehen']],
  ['Bent-Knee_Hip_Raise','Hüftheben mit gebeugten Knien','Bent-Knee Hip Raise','unten',1,'reps',12,M,1200,
    ['Rückenlage, die Knie gebeugt und angehoben, Arme neben dem Körper.','Das Becken mit dem Bauch vom Boden heben, die Knie zeigen zur Decke.','Langsam ablegen, ohne die Füße abzusetzen.'],
    ['Schwung aus den Beinen','Mit den Armen abdrücken']],
  ['Bottoms_Up','Bottoms Up','Bottoms Up','unten',2,'reps',10,M,1500,
    ['Rückenlage, Beine gestreckt, Arme neben dem Körper.','Knie zur Brust ziehen, dann die Beine senkrecht nach oben strecken.','Das Becken vom Boden heben, kurz halten und kontrolliert zurück.'],
    ['Beine kippen zum Kopf','Mit Schwung arbeiten']],
  ['Butt-Ups','Po-Heben im Stütz','Butt-Ups','tief',1,'reps',12,M,1300,
    ['Unterarmstütz, die Ellbogen stehen unter den Schultern.','Den Po Richtung Decke schieben, bis der Körper ein umgedrehtes V bildet.','Zurück in die gerade Linie, ohne durchzuhängen.'],
    ['Hüfte hängt durch','Zu schnell absenken']],
  ['Cable_Crunch','Kniender Kabel-Crunch','Cable Crunch','oben',2,'reps',12,'Kabelzug mit Seil',1300,
    ['Vor dem Kabelzug knien, das Seil neben dem Kopf halten.','Den Oberkörper aus dem Bauch einrollen, die Ellbogen ziehen Richtung Knie.','Langsam aufrichten, die Hüfte bleibt ruhig.'],

/* Foto-Animation: zwei echte Fotos (Start und Ende) blenden im Takt der Übung */
function anim(ex, opts){
  const o = opts || {};
  const d = ((ex.ms * 2) / (o.speed || 1) / 1000).toFixed(2) + 's';
  const cls = ['anim', o.cls || '', o.mirror ? 'mir' : '', o.frame === 0 ? 'frame0' : o.frame === 1 ? 'frame1' : '', o.paused ? 'paused' : ''].join(' ');
  return '<span class="' + cls + '" style="--d:' + d + '">' +
    '<img src="' + img(ex.id, 0) + '" alt="' + esc(ex.name) + ', Startposition"' + (o.eager ? '' : ' loading="lazy"') + ' decoding="async">' +
    '<img class="b" src="' + img(ex.id, 1) + '" alt=""' + (o.eager ? '' : ' loading="lazy"') + ' decoding="async">' +
  '</span>';
}
function phases(ex, opts){
  const o = opts || {};
  const d = ((ex.ms * 2) / (o.speed || 1) / 1000).toFixed(2) + 's';
  const stat = o.frame === 0 || o.frame === 1;
  return '<span class="ph' + (stat ? ' static' : '') + (o.paused ? ' paused' : '') + '" style="--d:' + d + '" aria-hidden="true"><span class="p0' + (o.frame === 0 ? ' on' : '') + '">Start</span><span class="p1' + (o.frame === 1 ? ' on' : '') + '">Ende</span></span>';
}

let actx = null;
function beep(freq, len){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = 'sine';
    g.gain.setValueAtTime(.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18, actx.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + (len || .18));
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (len || .18) + .05);
  } catch(e){}
}

function stats(){
  const h = S.history;
  const days = new Set(h.map((x) => new Date(x.at).toDateString()));
  let streak = 0;
  const d = new Date();
  if (!days.has(d.toDateString())) d.setDate(d.getDate() - 1);
  while (days.has(d.toDateString())){ streak++; d.setDate(d.getDate() - 1); }
  return { count:h.length, minutes:h.reduce((a, x) => a + x.min, 0), streak };
}

/* ---------- Training ---------- */
let run = null;
function buildQueue(ids, rounds, mode){
  const q = [];
  const tm = TIMING[S.level];
  for (let r = 0; r < rounds; r++){
    ids.forEach((id, i) => {
      const e = EX[id];
      const target = mode === 'single' && S.amt != null ? S.amt : amountFor(e);
      const work = mode === 'single'
        ? (e.type === 'time' ? target : Math.max(20, Math.round(target * e.ms * 2 / 1000)))
        : (e.type === 'time' ? Math.max(tm.work, target) : tm.work);
      q.push({ kind:'work', id, secs:work, target: e.type === 'time' ? work + ' Sek.' : target + ' Wdh.' });
      const last = r === rounds - 1 && i === ids.length - 1;
      const rest = mode === 'single' ? S.rest : tm.rest;
      if (!last && rest > 0) q.push({ kind:'rest', id: mode === 'single' ? id : (ids[i + 1] || ids[0]), secs:rest });
    });
  }
  return q;
}
function startRun(name, ids, rounds, mode){
  const queue = [{ kind:'ready', id:ids[0], secs:5 }].concat(buildQueue(ids, rounds, mode));
  run = { name, queue, i:0, left:queue[0].secs, paused:false, last:performance.now(), total:queue.reduce((a, x) => a + (x.kind === 'work' ? x.secs : 0), 0), done:false, workCount:queue.filter((x) => x.kind === 'work').length };
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { if (run) run.lock = l; }).catch(() => {}); } catch(e){}
  beep(660, .12);
  renderPlayer(true);
  tick();
}
let tickT = null;
function tick(){
  clearTimeout(tickT);
  if (!run || run.done) return;
  const now = performance.now();
  if (!run.paused){
    run.left -= (now - run.last) / 1000;
    const whole = Math.ceil(run.left);
    if (whole !== run.shown){ run.shown = whole; if (whole <= 3 && whole > 0) beep(880, .09); updateNum(); }
    if (run.left <= 0) advance(1);
  }
  run.last = now;
  updateRing();
  tickT = setTimeout(tick, 100);
}
function advance(step){
  run.i = Math.max(0, run.i + step);
  if (run.i >= run.queue.length){ finish(); return; }
  run.left = run.queue[run.i].secs;
  run.shown = null;
  beep(run.queue[run.i].kind === 'work' ? 990 : 520, .22);
  renderPlayer(false);
}
function finish(){
  run.done = true;
  clearTimeout(tickT);
  const min = Math.max(1, Math.round(run.total / 60));
  S.history.push({ at:Date.now(), min, name:run.name });
  store.set('history', S.history);
  beep(1180, .35);
  renderPlayer(false);
}
function closeRun(){
  clearTimeout(tickT);
  try { if (run && run.lock) run.lock.release(); } catch(e){}
  run = null;
  const p = document.getElementById('player');
  if (p) p.remove();
  render();
}
function renderPlayer(first){
  let p = document.getElementById('player');
  if (!p){ p = document.createElement('div'); p.id = 'player'; p.className = 'player'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-modal', 'true'); p.setAttribute('aria-label', 'Training'); document.body.appendChild(p); p.addEventListener('click', onPlayerClick); }
  if (run.done){
    const st = stats();
    p.innerHTML = '<div class="app" style="justify-content:center;min-height:100%">' +
      '<div class="coach" style="aspect-ratio:4/3.6"><img src="' + coachSrc() + '" alt="' + coachName() + '"></div>' +
      '<div class="col" style="gap:10px;text-align:center"><span class="eyebrow">' + esc(run.name) + '</span><h2 class="title-xl">Geschafft.</h2><span class="muted">' + run.workCount + (run.workCount === 1 ? ' Satz' : ' Sätze') + ' · ' + Math.max(1, Math.round(run.total / 60)) + ' Minuten Arbeit · ' + st.streak + (st.streak === 1 ? ' Tag' : ' Tage') + ' in Folge</span></div>' +
      '<button type="button" class="btn" data-act="close-run">Fertig</button></div>';
    return;
  }
  const it = run.queue[run.i];
  const e = EX[it.id];
  const works = run.queue.map((x, i) => [x, i]).filter(([x]) => x.kind === 'work');
  const wIdx = works.findIndex(([, i]) => i >= run.i);
  const nextWork = run.queue.slice(run.i + 1).find((x) => x.kind === 'work');
  const label = it.kind === 'ready' ? 'Mach dich bereit' : it.kind === 'rest' ? 'Pause, gleich geht’s weiter mit' : 'Satz ' + (wIdx + 1) + ' von ' + works.length;
  const moving = it.kind === 'work';
  p.innerHTML = '<div class="app">' +
    '<div class="row between"><button type="button" class="rbtn sm" data-act="close-run" aria-label="Training beenden">' + ic('close') + '</button><span class="small muted">' + esc(run.name) + '</span><button type="button" class="rbtn sm" data-act="sound" aria-pressed="' + S.sound + '" aria-label="Ton umschalten">' + ic(S.sound ? 'sound' : 'mute') + '</button></div>' +
    '<div class="segs" aria-hidden="true">' + works.map(([, i]) => '<i class="' + (i < run.i ? 'done' : i === run.i ? 'now' : '') + '" data-seg="' + i + '"></i>').join('') + '</div>' +
    '<div class="col" style="gap:4px;text-align:center"><span class="small muted">' + label + '</span><h2 style="font-size:24px;font-weight:400">' + esc(e.name) + '</h2>' + (moving ? '<span class="muted small">Ziel: ' + it.target + '</span>' : '') + '</div>' +
    '<div class="pstage">' + anim(e, { eager:true, frame: moving ? null : 0, paused: run.paused }) +
      (moving ? '<span class="phwrap">' + phases(e, { paused: run.paused }) + '</span>' : '<span class="rest">' + (it.kind === 'ready' ? 'Startposition einnehmen' : 'Durchatmen') + '</span>') + '</div>' +
    '<div class="timer"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3"/><circle id="ring" cx="100" cy="100" r="92" fill="none" stroke="var(--halo)" stroke-width="3" stroke-linecap="round" stroke-dasharray="578" stroke-dashoffset="0"/></svg>' +
      '<div class="num"><div class="col" style="align-items:center;gap:4px"><span class="big" id="tnum" style="font-size:84px">' + Math.ceil(run.left) + '</span><span class="small muted">' + (moving ? 'Sekunden' : it.kind === 'rest' ? 'Pause' : 'Start in') + '</span></div></div></div>' +
    '<div class="ctrl"><button type="button" class="rbtn" data-act="prev" aria-label="Zurück">' + ic('prev') + '</button>' +
      '<button type="button" class="rbtn xl solid" data-act="pause" aria-label="' + (run.paused ? 'Weiter' : 'Pause') + '">' + ic(run.paused ? 'play' : 'pause') + '</button>' +
      '<button type="button" class="rbtn" data-act="next" aria-label="Überspringen">' + ic('next') + '</button></div>' +
    (nextWork && nextWork.id !== it.id ? '<div class="next glass">' + anim(EX[nextWork.id], { cls:'thumb', frame:0 }) + '<div class="col" style="gap:3px;min-width:0"><span class="small muted">Als Nächstes</span><b style="font-weight:500">' + esc(EX[nextWork.id].name) + '</b></div></div>' : '') +
  '</div>';
  if (first) p.scrollTop = 0;
  updateRing();
}
function updateNum(){ const n = document.getElementById('tnum'); if (n && run) n.textContent = Math.max(0, Math.ceil(run.left)); }
function updateRing(){
  if (!run || run.done) return;
  const it = run.queue[run.i];
  const frac = Math.max(0, Math.min(1, run.left / it.secs));
  const ring = document.getElementById('ring');
  if (ring) ring.setAttribute('stroke-dashoffset', (578 * (1 - frac)).toFixed(1));
  const seg = document.querySelector('[data-seg="' + run.i + '"]');
  if (seg) seg.style.setProperty('--p', ((1 - frac) * 100).toFixed(1) + '%');
}
function onPlayerClick(ev){
  const b = ev.target.closest('[data-act]');
  if (!b || !run) return;
  const a = b.getAttribute('data-act');
  if (a === 'close-run') closeRun();
  else if (run.done) return;
  else if (a === 'pause'){ run.paused = !run.paused; run.last = performance.now(); renderPlayer(false); }
  else if (a === 'next') advance(1);
  else if (a === 'prev') advance(-1);
  else if (a === 'sound'){ S.sound = !S.sound; store.set('sound', S.sound); renderPlayer(false); }
}

/* ---------- Rendern & Ereignisse ---------- */
function render(){
  const html = S.view === 'library' ? viewLibrary() : S.view === 'favs' ? viewFavs() : S.view === 'detail' ? viewDetail() : S.view === 'profile' ? viewProfile() : viewHome();
  root.innerHTML = html + (S.onboard ? viewOnboard() : '');
  const q = document.getElementById('q');
  if (q){ q.addEventListener('input', () => { S.q = q.value; document.getElementById('list').innerHTML = listItems(filtered()); }); }
}
function go(v){ S.back = v; S.view = v; window.scrollTo(0, 0); render(); }

root.addEventListener('click', (ev) => {
  const t = ev.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.go){ go(d.go); return; }
  if (d.zone){ S.zone = d.zone; render(); return; }
  if (d.prog){ S.program = d.prog; store.set('program', S.program); render(); window.scrollTo({ top:0, behavior: REDUCED ? 'auto' : 'smooth' }); return; }
  if (d.ex){ S.exId = d.ex; S.amt = null; S.sets = 3; S.frame = 'anim'; if (S.view !== 'detail') S.back = S.view; S.view = 'detail'; window.scrollTo(0, 0); render(); return; }
  if (d.libzone){ S.libZone = d.libzone; render(); return; }
  if (d.liblevel){ S.libLevel = +d.liblevel; render(); return; }
  if (d.jump){ const el = document.getElementById('L-' + d.jump); if (el) el.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block:'start' }); return; }
  if (d.tempo){ S.tempo = d.tempo; S.frame = 'anim'; render(); return; }
  if (d.frame){ S.frame = d.frame; render(); return; }
  if (d.rest){ S.rest = +d.rest; render(); return; }
  if (d.level){ S.level = +d.level; store.set('level', S.level); render(); return; }
  if (d.gender){ S.gender = d.gender; store.set('gender', S.gender); render(); return; }
  const a = d.act;
  if (!a) return;
  const p = PG[S.program];
  if (a === 'sound'){ S.sound = !S.sound; store.set('sound', S.sound); if (S.sound) beep(700, .1); render(); }
  else if (a === 'rounds-'){ S.rounds = Math.max(1, S.rounds - 1); render(); }
  else if (a === 'rounds+'){ S.rounds = Math.min(5, S.rounds + 1); render(); }
  else if (a === 'prog'){ const i = PROGRAMS.indexOf(p); S.program = PROGRAMS[(i + 1) % PROGRAMS.length].id; store.set('program', S.program); render(); }
  else if (a === 'level'){ S.level = (S.level + 1) % 3; store.set('level', S.level); render(); }
  else if (a === 'peek'){ S.libZone = 'alle'; S.libLevel = -1; S.q = ''; go('library'); }
  else if (a === 'start-prog'){ startRun(p.name, p.ids, S.rounds, 'prog'); }
  else if (a === 'start-favs'){ startRun('Favoriten', X.filter((e) => S.favs.includes(e.id)).map((e) => e.id), 1, 'prog'); }
  else if (a === 'back'){ S.view = S.back && S.back !== 'detail' ? S.back : 'library'; window.scrollTo(0, 0); render(); }
  else if (a === 'fav'){ const i = S.favs.indexOf(S.exId); if (i >= 0) S.favs.splice(i, 1); else S.favs.push(S.exId); store.set('favs', S.favs); render(); }
  else if (a === 'amt-' || a === 'amt+'){ const e = EX[S.exId]; const step = e.type === 'time' ? 5 : 1; const cur = S.amt == null ? amountFor(e) : S.amt; S.amt = Math.max(step, Math.min(e.type === 'time' ? 180 : 60, cur + (a === 'amt+' ? step : -step))); render(); }
  else if (a === 'sets'){ S.sets = S.sets >= 5 ? 1 : S.sets + 1; render(); }
  else if (a === 'mirror'){ S.mirror = !S.mirror; render(); }
  else if (a === 'slowmo'){ S.tempo = S.tempo === 'langsam' ? 'normal' : 'langsam'; S.frame = 'anim'; render(); }
  else if (a === 'start-ex'){ const e = EX[S.exId]; startRun(e.name, [e.id], S.sets, 'single'); }
  else if (a === 'ob-done'){ if (!S.gender) return; S.onboard = false; store.set('onboarded', true); render(); }
});

if (!store.get('onboarded', false)) S.onboard = true;
render();
})();
</script>
