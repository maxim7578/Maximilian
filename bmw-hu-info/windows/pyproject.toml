[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-hu-info"
version = "0.1.0"
description = "Lesender SSH-Diagnose-Client fuer BMW-Headunits (NBT/NBTEVO/ENAVEVO/MGU)"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4,<4"]

[project.scripts]
bmw-hu-info = "bmw_hu_info.cli:main"
bmw-hu-info-gui = "bmw_hu_info.gui:main"

[tool.setuptools]
packages = ["bmw_hu_info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
