[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vako-hu"
version = "0.2.0"
description = "Vako-HU - lesender SSH-Diagnose-Client fuer BMW-Headunits (NBT/NBTEVO/ENAVEVO/MGU)"
requires-python = ">=3.10"
dependencies = ["paramiko>=3.4,<4"]

[project.scripts]
vako-hu = "bmw_hu_info.cli:main"
vako-hu-gui = "bmw_hu_info.gui:main"

[tool.setuptools]
packages = ["bmw_hu_info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
