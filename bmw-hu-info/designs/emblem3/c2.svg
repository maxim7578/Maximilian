<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256">
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/><stop offset="16%" stop-color="#e9eef7"/>
    <stop offset="34%" stop-color="#9aa7bd"/><stop offset="49%" stop-color="#596277"/>
    <stop offset="51%" stop-color="#2b3340"/><stop offset="66%" stop-color="#8b97ad"/>
    <stop offset="86%" stop-color="#eef3fa"/><stop offset="100%" stop-color="#cfd6e2"/>
  </linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f7fc"/><stop offset=".3" stop-color="#7d889c"/>
    <stop offset=".5" stop-color="#2c333f"/><stop offset=".72" stop-color="#aab4c6"/>
    <stop offset="1" stop-color="#eef2f9"/>
  </linearGradient>
  <radialGradient id="plate" cx=".5" cy=".35" r=".9">
    <stop offset="0" stop-color="#20273a"/><stop offset="1" stop-color="#070a12"/>
  </radialGradient>
  <filter id="bevel" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.95" specularExponent="22" lighting-color="#ffffff" result="spec">
      <fePointLight x="-60" y="-90" z="160"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specOut"/>
    <feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="lit"/>
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/>
  </filter>
</defs>
<text x="256" y="130" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900" fill="url(#chrome)" text-anchor="middle" filter="url(#bevel)" letter-spacing="2">VAKO</text>
<text x="256" y="175" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#9fb0c6" text-anchor="middle" letter-spacing="10">BMW HU</text>
<g opacity="0.18" transform="translate(0,300) scale(1,-1)">
<text x="256" y="130" font-family="Arial Black, Arial, sans-serif" font-size="120" font-weight="900" fill="url(#chrome)" text-anchor="middle" letter-spacing="2">VAKO</text></g>
</svg>
