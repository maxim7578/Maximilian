# Baut die Android-App von VaKoViN (vakovin-app/) als APK.
# Die fertige Datei liegt danach als Artefakt "VaKoViN-apk" am Lauf
# (Actions -> Lauf öffnen -> unten "Artifacts").
name: VaKoViN Android-APK

on:
  push:
    paths:
      - "vakovin-app/**"
      - ".github/workflows/vakovin-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vakovin-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vakovin-app

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Das Android SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME);
      # fehlende Plattformen lädt Gradle selbst nach.
      - name: Android SDK prüfen
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"

      - name: Abhängigkeiten installieren
        run: bun install --frozen-lockfile

      # Die APK lädt https://vakovin.lovable.app; in der APK liegt nur die
      # Offline-Seite (shell/).
      - name: Android-Projekt synchronisieren
        run: bun run build:android

      - name: APK bauen (Debug-Signatur)
        working-directory: vakovin-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VaKoViN.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VaKoViN-apk
          path: vakovin-app/VaKoViN.apk
          if-no-files-found: error

      # Die APK zusätzlich in den Branch legen, damit sie direkt als Datei
      # im Repository liegt (vakovin-app/release/VaKoViN.apk).
      - name: APK in den Branch legen
        if: github.event_name == 'push'
        run: |
          mkdir -p release
          cp VaKoViN.apk release/VaKoViN.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/VaKoViN.apk
          git commit -m "build: VaKoViN.apk aus Lauf ${{ github.run_number }} [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}

      # Letztes Update für alte APKs mit Updater (bis Lauf 7): Sie bekommen die
      # Umleitungsseite ota-redirect/ und werden zur neuen App geschickt.
      - name: Update-Paket veröffentlichen
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.run_number }}
        run: |
          (cd ota-redirect && zip -qr "../vakovin-$VERSION.zip" .)
          URL="https://github.com/${{ github.repository }}/releases/download/vakovin-latest/vakovin-$VERSION.zip"
          printf '{"version":"%s","url":"%s"}\n' "$VERSION" "$URL" > update.json
          cat update.json
          gh release view vakovin-latest >/dev/null 2>&1 || gh release create vakovin-latest \
            --title "VaKoViN Updates" --latest=false \
            --notes "Automatische Updates der VaKoViN-App. Wird bei jedem Build überschrieben."
          gh release upload vakovin-latest "vakovin-$VERSION.zip" --clobber
          gh release upload vakovin-latest update.json --clobber
          gh release upload vakovin-latest VaKoViN.apk --clobber
          for a in $(gh release view vakovin-latest --json assets -q '.assets[].name' | grep '^vakovin-.*\.zip$' | grep -v "^vakovin-$VERSION.zip$"); do
            gh release delete-asset vakovin-latest "$a" -y
          done
