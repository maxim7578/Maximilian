# Testet bmw-cardata auf Windows und baut die Windows-Programme (App und Kommandozeile).
# Die fertigen .exe-Dateien liegen danach als Artefakt "bmw-cardata-windows" am Lauf.
name: bmw-cardata Windows

on:
  push:
    paths:
      - "bmw-cardata/**"
      - ".github/workflows/bmw-cardata-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bmw-cardata-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Tests und Windows-Programme
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bmw-cardata

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" "pyinstaller>=6,<7"

      - name: Tests auf Windows
        run: python -m pytest -q

      - name: App bauen (BMW-CarData.exe)
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BMW-CarData --collect-submodules bmw_cardata --hidden-import paho.mqtt.client windows/app.py

      - name: Kommandozeile bauen (bmw-cardata.exe)
        run: python -m PyInstaller --noconfirm --onefile --console --name bmw-cardata --collect-submodules bmw_cardata --hidden-import paho.mqtt.client windows/cli.py

      - name: Kommandozeile ausprobieren
        run: |
          dist\bmw-cardata.exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dist\bmw-cardata.exe --state "$env:RUNNER_TEMP\probe\state.json" kontingent
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: App starten und prüfen, dass sie läuft
        run: |
          $app = Start-Process -FilePath dist\BMW-CarData.exe -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { Write-Error "Die App hat sich beim Start beendet (Code $($app.ExitCode))"; exit 1 }
          Get-Process -Name BMW-CarData | Stop-Process -Force
          Write-Output "Die App läuft."

      - name: Paket zusammenstellen
        run: Copy-Item windows\LIESMICH.txt dist\

      - name: Programme hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bmw-cardata-windows
          path: |
            bmw-cardata/dist/BMW-CarData.exe
            bmw-cardata/dist/bmw-cardata.exe
            bmw-cardata/dist/LIESMICH.txt
          if-no-files-found: error
          retention-days: 30
