[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmw-cardata"
version = "0.5.0"
description = "Kommandozeilen-Client für die offizielle BMW CarData API und ihren Datenstrom (nur lesend)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27,<1", "paho-mqtt>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
bmw-cardata = "bmw_cardata.cli:main"

[project.gui-scripts]
bmw-cardata-app = "bmw_cardata.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bmw_cardata --cov-report=term-missing --cov-fail-under=80"
