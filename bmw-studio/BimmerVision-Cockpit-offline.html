<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>BimmerVision Cockpit</title>
<style>
/* Offline-Oberflaeche: Cockpit-Starter + Diagnose (Fault Scanner, MV Tools, Live-Daten, Drag-Timer, Fahrzeugdaten). Systemschriften, kein Internet. Nur lesende Demo. */
:root {
  color-scheme: dark;
  --bg: #04060b; --panel: #0b1221; --fg: #f1f5f9; --muted: #8a97ab; --soft: #cbd5e1;
  --m-light: #009ada; --m-dark: #2b3990; --m-blue: #1c69d4; --m-red: #e7222e; --m-text: #5ec8f2;
  --ok: #22c55e; --warn: #f5b301; --crit: #ff5a63;
  --edge: rgb(255 255 255 / 10%);
  --f-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--f-sans); -webkit-font-smoothing: antialiased; overflow: hidden; user-select: none; }
.screen {
  position: relative; width: 100vw; height: 100vh; overflow: hidden;
  background: radial-gradient(70% 90% at 100% 0%, rgb(0 154 218 / 15%), transparent 60%), radial-gradient(50% 80% at 0% 100%, rgb(231 34 46 / 8%), transparent 60%), linear-gradient(180deg, #070b16, #04060b);
  display: grid; grid-template-rows: auto 1fr; font-size: clamp(12px, 1.25vw, 18px);
}
.screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: .22em; background: linear-gradient(90deg, transparent, var(--m-blue) 15%, var(--m-light) 50%, var(--m-blue) 85%, transparent); box-shadow: 0 0 1.2em .15em rgb(0 154 218 / 50%); z-index: 6; }

.bar { display: flex; align-items: center; gap: 1.1em; padding: .8em 1.4em .4em; z-index: 5; -webkit-app-region: drag; }
.bar .home { width: 1.4em; height: 1.4em; color: var(--soft); }
.bar h1 { margin: 0; font-size: 1em; font-weight: 600; color: var(--m-red); }
.bar .brand { margin-left: auto; display: flex; align-items: center; gap: .5em; font: 650 .95em/1 var(--f-sans); -webkit-app-region: no-drag; }
.bar .brand .em { width: 1.5em; height: 1.5em; }
.bar .brand span { color: var(--m-text); }
.bar .clock { font: 500 .85em/1 var(--f-mono); color: var(--soft); }
.bar .obd { font: 600 .58em/1 var(--f-mono); letter-spacing: .1em; color: var(--warn); border: 1px solid rgb(245 179 1 / 45%); border-radius: 99em; padding: .4em .7em; }

.side { position: absolute; left: 0; top: 3.1em; bottom: 0; width: 4.6em; display: grid; align-content: start; gap: .5em; padding: .7em .55em; z-index: 4; }
.side button { display: grid; justify-items: center; gap: .25em; padding: .55em .2em; border: 0; border-radius: .7em; background: transparent; color: var(--muted); font: 500 .58em/1.1 var(--f-sans); cursor: pointer; }
.side button svg { width: 2.1em; height: 2.1em; }
.side button[aria-current="page"] { background: rgb(0 154 218 / 16%); color: var(--m-text); }

.home-view { position: absolute; left: 5em; right: 1.4em; top: 3.4em; bottom: 1em; display: grid; grid-template-rows: auto 1fr; gap: .7em; transition: opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1); }
.home-view.away { opacity: 0; transform: scale(.94); pointer-events: none; }
.m-stripe { display: inline-flex; width: 5em; height: .22em; transform: skewX(-20deg); }
.m-stripe i { flex: 1; } .m-stripe i:nth-child(1){background:var(--m-light);} .m-stripe i:nth-child(2){background:var(--m-dark);} .m-stripe i:nth-child(3){background:var(--m-red);}
.grid { display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); gap: .5em .9em; }
.tile { position: relative; display: grid; justify-items: center; align-content: center; gap: .5em; padding: .4em; border-radius: 1em; background: transparent; border: 1px solid transparent; color: var(--fg); cursor: pointer; font: inherit; transition: background-color .2s, border-color .2s, transform .2s; }
.tile .ic { width: 3.9em; height: 3.9em; border-radius: 1.05em; display: grid; place-items: center; color: #fff; box-shadow: 0 .4em 1.2em -.5em rgb(0 0 0 / 80%), inset 0 1px 0 rgb(255 255 255 / 25%); }
.tile .ic svg { width: 2em; height: 2em; }
.tile b { font-size: .78em; font-weight: 600; text-align: center; }
.tile small { position: absolute; top: .3em; right: .7em; font: 600 .46em/1 var(--f-mono); letter-spacing: .08em; color: var(--warn); border: 1px solid rgb(245 179 1 / 45%); border-radius: 99em; padding: .3em .5em; }
.tile.focus, .tile:hover { background: rgb(255 255 255 / 6%); border-color: rgb(0 154 218 / 55%); box-shadow: 0 0 0 .16em rgb(0 154 218 / 18%); }
.tile:active { transform: scale(.96); }
.c-blue{background:linear-gradient(145deg,#0fb3f5,#1c69d4);} .c-dark{background:linear-gradient(145deg,#3f51c6,#1f2a6b);}
.c-red{background:linear-gradient(145deg,#ff4d57,#b3121c);} .c-teal{background:linear-gradient(145deg,#23d0c0,#0b7f86);}
.c-gray{background:linear-gradient(145deg,#5b6577,#2b3240);} .c-amber{background:linear-gradient(145deg,#ffc23a,#d97706);}
.c-green{background:linear-gradient(145deg,#3ee07f,#128a43);} .c-white{background:linear-gradient(145deg,#eef2f7,#9aa6b8);color:#0b1222;}

.app { position: absolute; left: 5em; right: 1.4em; top: 3.4em; bottom: 1em; border-radius: 1.1em; overflow: hidden; background: linear-gradient(180deg, rgb(14 22 42 / 94%), rgb(8 12 24 / 97%)); border: 1px solid var(--edge); box-shadow: 0 1.4em 3em -1em rgb(0 0 0 / 80%); display: grid; grid-template-rows: auto 1fr; opacity: 0; transform: scale(.92); pointer-events: none; transform-origin: var(--ox,50%) var(--oy,50%); transition: opacity .3s, transform .45s cubic-bezier(.2,.8,.2,1); }
.app.open { opacity: 1; transform: none; pointer-events: auto; }
.app::before { content: ""; position: absolute; inset: 0 0 auto; height: .2em; background: linear-gradient(90deg, var(--m-light) 0 33.3%, var(--m-dark) 33.3% 66.6%, var(--m-red) 66.6%); }
.app header { display: flex; align-items: center; gap: .8em; padding: .9em 1.3em .5em; }
.app header button.back { width: 2.3em; height: 2.3em; border-radius: 50%; border: 1px solid var(--edge); background: rgb(255 255 255 / 6%); color: var(--fg); display: grid; place-items: center; cursor: pointer; }
.app header button.back svg { width: 1.2em; height: 1.2em; }
.app header h2 { margin: 0; font-size: 1.15em; font-weight: 700; }
.app header .tag { margin-left: auto; font: 600 .58em/1 var(--f-mono); letter-spacing: .1em; color: var(--warn); border: 1px solid rgb(245 179 1 / 45%); border-radius: 99em; padding: .45em .8em; }
.app .body { padding: .3em 1.3em 1.1em; min-height: 0; }

/* Fahrzeugdaten */
.car { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1.5em; height: 100%; align-items: center; }
.vin { display: grid; gap: .5em; }
.vin small { font: 600 .62em/1 var(--f-mono); letter-spacing: .12em; color: var(--muted); }
.vin .code { display: flex; gap: .3em; flex-wrap: wrap; }
.vin .code span { width: 1.6em; height: 2.2em; display: grid; place-items: center; border-radius: .4em; background: rgb(11 18 32 / 70%); border: 1px solid rgb(0 154 218 / 35%); font: 600 .95em/1 var(--f-mono); }
.vin .code span.w { color: var(--m-text); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: .6em; }
.fact { padding: .75em 1em; border-radius: .9em; background: rgb(255 255 255 / 5%); border: 1px solid var(--edge); display: grid; gap: .2em; }
.fact small { font-size: .64em; color: var(--muted); } .fact b { font-size: .92em; font-weight: 600; }

/* Fault Scanner */
.fs { display: grid; grid-template-columns: 14em 1fr; gap: 1em; height: 100%; min-height: 0; }
.units { display: grid; align-content: start; gap: .32em; overflow: auto; padding-right: .3em; }
.unit { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .55em; padding: .5em .65em; border-radius: .65em; background: rgb(255 255 255 / 4%); font-size: .8em; }
.unit .dot { width: .65em; height: .65em; border-radius: 50%; background: var(--muted); }
.unit.scan .dot { background: var(--m-light); animation: pulse 1s infinite; }
.unit.ok .dot { background: var(--ok); } .unit.fault .dot { background: var(--crit); box-shadow: 0 0 .5em var(--crit); }
.unit .n { font-weight: 600; min-width: 0; } .unit .n small { display: block; color: var(--muted); font: 400 .78em/1.2 var(--f-mono); }
.unit .c { font: 600 .9em/1 var(--f-mono); color: var(--muted); }
.unit.fault .c { color: var(--crit); } .unit.ok .c { color: var(--ok); }
@keyframes pulse { 50% { opacity: .35; } }
.codes { display: grid; grid-template-rows: auto 1fr auto; gap: .6em; min-height: 0; }
.codes .head { display: flex; align-items: center; gap: .8em; }
.codes .head h3 { margin: 0; font-size: 1em; font-weight: 700; }
.codes .sum { margin-left: auto; display: flex; gap: 1.1em; font-size: .72em; }
.codes .sum b { font: 700 1.35em/1 var(--f-mono); display: block; }
.sum .c-c b { color: var(--crit); } .sum .c-w b { color: var(--warn); } .sum .c-o b { color: var(--ok); }
.list { overflow: auto; display: grid; align-content: start; gap: .45em; padding-right: .3em; }
.code { display: grid; grid-template-columns: auto auto 1fr; gap: .3em 1em; padding: .65em .85em; border-radius: .75em; background: rgb(255 255 255 / 4%); border-left: .25em solid var(--muted); }
.code.crit { border-left-color: var(--crit); } .code.warn { border-left-color: var(--warn); }
.code .id { font: 700 .92em/1 var(--f-mono); } .code .ecu { justify-self: end; grid-column: 3; font: 500 .68em/1 var(--f-mono); color: var(--muted); }
.code .desc { grid-column: 1 / -1; font-size: .82em; color: var(--soft); } .code .meta { grid-column: 1 / -1; display: flex; gap: 1em; font: 500 .66em/1 var(--f-mono); color: var(--muted); }
.sev { font: 700 .6em/1 var(--f-mono); letter-spacing: .08em; padding: .3em .5em; border-radius: .4em; align-self: center; }
.sev.crit { color: var(--crit); background: rgb(255 90 99 / 14%); } .sev.warn { color: var(--warn); background: rgb(245 179 1 / 14%); }
.codes .foot { display: flex; align-items: center; gap: .7em; }
.pill { border: 0; border-radius: 99em; padding: .65em 1.2em; font: 600 .78em/1 var(--f-sans); color: #fff; cursor: pointer; background: linear-gradient(90deg,#009ada,#1c69d4,#2b3990); display: inline-flex; align-items: center; gap: .5em; }
.pill svg { width: 1.1em; height: 1.1em; } .pill.ghost { background: rgb(255 255 255 / 7%); border: 1px solid var(--edge); } .pill:disabled { opacity: .45; cursor: default; }
.foot .note { font-size: .68em; color: var(--muted); margin-left: auto; }
.empty { display: grid; place-items: center; height: 100%; text-align: center; gap: .4em; color: var(--muted); }
.empty svg { width: 2.6em; height: 2.6em; color: var(--ok); } .empty p { max-width: 24em; font-size: .85em; }

/* MV Tools */
.mv { display: grid; grid-template-columns: 1.25fr 1fr; gap: 1em; height: 100%; min-height: 0; }
.mv h3 { margin: 0 0 .5em; font-size: .9em; font-weight: 700; display: flex; align-items: center; gap: .5em; }
.mv h3 .s { font: 600 .66em/1 var(--f-mono); color: var(--muted); letter-spacing: .06em; margin-left: auto; }
.bars { display: grid; grid-template-rows: repeat(6, 1fr); gap: .45em; height: calc(100% - 2em); }
.crow { display: grid; grid-template-columns: 3.1em 1fr 2.8em; align-items: center; gap: .6em; }
.crow .lab { font: 600 .76em/1 var(--f-mono); color: var(--soft); }
.crow .track { height: 1em; border-radius: .5em; background: rgb(255 255 255 / 6%); overflow: hidden; }
.crow .fill { height: 100%; width: 0; border-radius: .5em; background: linear-gradient(90deg, var(--m-light), var(--m-blue)); transition: width .25s; }
.crow.hot .fill { background: linear-gradient(90deg, var(--warn), var(--crit)); }
.crow .v { font: 700 .82em/1 var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; } .crow.hot .v { color: var(--crit); }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .45em; height: calc(100% - 2em); }
.p { padding: .55em .75em; border-radius: .65em; background: rgb(255 255 255 / 4%); border: 1px solid var(--edge); display: grid; gap: .1em; align-content: center; }
.p small { font-size: .6em; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.p .row { display: flex; align-items: baseline; gap: .3em; } .p b { font: 700 1.2em/1 var(--f-mono); font-variant-numeric: tabular-nums; } .p u { font-style: normal; font-size: .6em; color: var(--muted); }
.p .spark { height: .8em; margin-top: .2em; } .p .spark path { fill: none; stroke: var(--m-text); stroke-width: 1.5; }

/* Live gauges */
.gauges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1em; height: 100%; align-items: center; }
.gauge { display: grid; justify-items: center; gap: .2em; }
.gauge svg { width: 8.5em; height: 8.5em; overflow: visible; }
.gauge .track { fill: none; stroke: rgb(255 255 255 / 9%); stroke-width: 7; stroke-linecap: round; }
.gauge .val { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .5s; }
.gauge text { fill: var(--fg); font: 700 15px var(--f-mono); text-anchor: middle; } .gauge text.u { fill: var(--muted); font: 500 7px var(--f-sans); }
.gauge b { font-size: .82em; font-weight: 600; } .gauge small { font-size: .68em; color: var(--muted); }

/* Drag timer */
.drag { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.5em; height: 100%; align-items: center; }
.drag .nums { display: flex; align-items: baseline; gap: 1.5em; }
.drag .nums b { font: 700 3.8em/1 var(--f-mono); font-variant-numeric: tabular-nums; } .drag .nums small { font-size: .8em; color: var(--muted); display: block; }
.drag .state { font: 600 .82em/1 var(--f-mono); letter-spacing: .1em; color: var(--m-text); }
.drag .bar2 { height: .5em; border-radius: .5em; background: rgb(255 255 255 / 8%); overflow: hidden; margin-top: .6em; } .drag .bar2 i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--m-light), var(--m-blue), var(--m-red)); }
.drag table { width: 100%; border-collapse: collapse; font-size: .9em; } .drag td { padding: .5em 0; border-bottom: 1px solid var(--edge); } .drag td:last-child { text-align: right; font: 600 1em/1 var(--f-mono); color: var(--m-text); }
.drag .btns { display: flex; gap: .6em; margin-top: 1em; }

/* soon */
.soon { display: grid; place-items: center; height: 100%; text-align: center; gap: .5em; color: var(--soft); }
.soon .ic { width: 4.4em; height: 4.4em; border-radius: 1.2em; display: grid; place-items: center; margin: 0 auto .5em; } .soon .ic svg { width: 2.3em; height: 2.3em; }
.soon p { margin: 0; font-size: .82em; color: var(--muted); max-width: 30em; }

.toast { position: absolute; left: 50%; bottom: 1.1em; transform: translate(-50%, 1em); opacity: 0; z-index: 9; padding: .6em 1.1em; border-radius: 99em; background: rgb(2 6 23 / 92%); border: 1px solid var(--edge); font-size: .74em; transition: opacity .3s, transform .3s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.disc { position: absolute; left: 5em; bottom: .35em; font: 500 .58em/1.3 var(--f-sans); color: var(--muted); z-index: 3; }
@media (prefers-reduced-motion: reduce) { .home-view, .app, .tile, .unit.scan .dot { transition: none; animation: none; } }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="bar">
    <svg class="home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 11l9-7 9 7v9H3z"/></svg>
    <h1 id="bar-title">Installierte Apps</h1>
    <span class="brand"><span class="em" id="emblem"></span><b>Bimmer<span>Vision</span></b></span>
    <span class="obd">OBD · DEMO</span>
    <span class="clock" id="clock">14:28</span>
  </div>

  <nav class="side" aria-label="Bereiche">
    <button type="button" aria-current="page" id="s-apps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</button>
    <button type="button" data-open="fehler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h0"/></svg>Fehler</button>
    <button type="button" data-open="mv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg>MV Tools</button>
    <button type="button" data-open="hilfe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h0"/></svg>Hilfe</button>
  </nav>

  <section class="home-view" id="home">
    <span class="m-stripe"><i></i><i></i><i></i></span>
    <div class="grid" id="grid">
      <button class="tile" data-open="fahrzeug"><span class="ic c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 15l2-6h14l2 6v3H3z"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg></span><b>Fahrzeugdaten</b></button>
      <button class="tile" data-open="ausstattung"><span class="ic c-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><b>Ausstattung</b></button>
      <button class="tile" data-open="historie"><span class="ic c-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg></span><b>Historie</b></button>
      <button class="tile" data-open="garage"><span class="ic c-gray"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 11l9-6 9 6v9H3z"/><path d="M8 20v-5h8v5"/></svg></span><b>Garage</b></button>
      <button class="tile" data-open="favoriten"><span class="ic c-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></span><b>Favoriten</b></button>
      <button class="tile" data-open="service"><span class="ic c-white"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.4 2.4-2.6-.6-.6-2.6z"/></svg></span><b>Service</b></button>
      <button class="tile" data-open="live"><span class="ic c-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg></span><b>Live-Daten</b><small>OBD</small></button>
      <button class="tile" data-open="fehler"><span class="ic c-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h0"/></svg></span><b>Fehlerspeicher</b><small>OBD</small></button>
      <button class="tile" data-open="mv"><span class="ic c-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/></svg></span><b>MV Tools</b><small>OBD</small></button>
      <button class="tile" data-open="drag"><span class="ic c-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M10 2h4"/></svg></span><b>Drag-Timer</b></button>
      <button class="tile" data-open="codierung"><span class="ic c-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="8" width="18" height="8" rx="4"/><circle cx="16" cy="12" r="2" fill="currentColor"/></svg></span><b>Codierung</b></button>
      <button class="tile" data-open="hilfe"><span class="ic c-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h0"/></svg></span><b>Hilfe</b></button>
    </div>
  </section>

  <section class="app" id="app">
    <header>
      <button class="back" id="back" aria-label="Zurück"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 id="app-title">App</h2>
      <span class="tag" id="app-tag" hidden>DEMO-WERTE</span>
    </header>
    <div class="body" id="app-body"></div>
  </section>

  <div class="toast" id="toast"></div>
  <div class="disc">Prototyp · Demo-Werte, kein echtes Fahrzeug · nur lesende Diagnose</div>
</div>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const EMBLEM = `<svg viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><defs><linearGradient id="ch" x1="49" y1="29" x2="203" y2="230" gradientUnits="userSpaceOnUse"><stop stop-color="#f4f7fa"/><stop offset=".35" stop-color="#ecf1f6"/><stop offset=".5" stop-color="#424a56"/><stop offset=".87" stop-color="#f4f7fa"/><stop offset="1" stop-color="#687380"/></linearGradient><linearGradient id="fa" x1="83" y1="34" x2="173" y2="228" gradientUnits="userSpaceOnUse"><stop stop-color="#252a31"/><stop offset=".46" stop-color="#07090c"/><stop offset="1" stop-color="#121821"/></linearGradient><linearGradient id="le" x1="128" y1="115" x2="128" y2="183" gradientUnits="userSpaceOnUse"><stop stop-color="#fcfdff"/><stop offset=".52" stop-color="#8492a3"/><stop offset="1" stop-color="#9ba9bb"/></linearGradient><linearGradient id="ro" x1="63" y1="79" x2="197" y2="98" gradientUnits="userSpaceOnUse"><stop stop-color="#2375ed"/><stop offset=".5" stop-color="#71caff"/><stop offset="1" stop-color="#3486ff"/></linearGradient></defs><circle cx="128" cy="128" r="109" fill="url(#ch)"/><circle cx="128" cy="128" r="99" fill="url(#fa)" stroke="#b4c1d2" stroke-opacity=".65" stroke-width="1.5"/><path d="M65 100L84 96L104 78C109 73 117 71 128 71H143C153 71 160 76 167 84L179 97L193 100" stroke="url(#ro)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 121H100C116 121 125 128 125 138C125 145 121 150 114 153C123 155 129 161 129 169C129 183 118 190 101 190H70V121ZM86 134V147H99C105 147 109 145 109 140C109 136 105 134 99 134H86ZM86 160V177H101C108 177 112 174 112 168C112 163 108 160 101 160H86Z" fill="url(#le)"/><path d="M128 121H146L162 169L179 121H197L171 190H153L128 121Z" fill="url(#le)"/></svg>`;
  document.getElementById("emblem").innerHTML = EMBLEM;

  const home = document.getElementById("home"), app = document.getElementById("app"), body = document.getElementById("app-body");
  const titleEl = document.getElementById("app-title"), tagEl = document.getElementById("app-tag"), barTitle = document.getElementById("bar-title");
  const tiles = [...document.querySelectorAll(".tile")], toast = document.getElementById("toast");
  let focus = 0, cleanup = null;
  const clock = document.getElementById("clock");
  const tick = () => clock.textContent = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  tick(); setInterval(tick, 15000);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const say = (t) => { toast.textContent = t; toast.classList.add("show"); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove("show"), 2400); };
  const setFocus = (i) => { focus = (i + tiles.length) % tiles.length; tiles.forEach((t, k) => t.classList.toggle("focus", k === focus)); };

  const TITLES = { fahrzeug: "Fahrzeugdaten", live: "Live-Daten", fehler: "Fehlerspeicher", mv: "MV Tools", drag: "Drag-Timer" };
  const SOON = {
    ausstattung: ["Ausstattung", "c-dark", "Zeigt die Sonderausstattung zur Kurz-FIN."],
    historie: ["Historie", "c-teal", "Deine letzten Abfragen als Zeitleiste."],
    garage: ["Garage", "c-gray", "Deine gespeicherten Fahrzeuge mit Notizen."],
    favoriten: ["Favoriten", "c-amber", "Schnellzugriff auf markierte Fahrzeuge."],
    service: ["Service", "c-white", "Service-Termine und Hinweise."],
    codierung: ["Codierung", "c-dark", "Übersicht, was bei deinem Modell freigeschaltet werden kann. Nur Anzeige, keine Eingriffe ins Fahrzeug."],
    hilfe: ["Hilfe", "c-green", "BimmerVision Cockpit – Prototyp. Alle Werte sind Demo. Echte Fahrzeugwerte brauchen einen OBD-Adapter; das wird hier noch nicht gelesen oder geschrieben."],
  };

  function open(id, fromEl) {
    if (cleanup) { cleanup(); cleanup = null; }
    const scr = document.getElementById("screen").getBoundingClientRect();
    if (fromEl) { const r = fromEl.getBoundingClientRect(); app.style.setProperty("--ox", `${r.left + r.width / 2 - scr.left}px`); app.style.setProperty("--oy", `${r.top + r.height / 2 - scr.top}px`); }
    const demo = ["fahrzeug", "live", "fehler", "mv"].includes(id);
    tagEl.hidden = !demo;
    if (RENDER[id]) { titleEl.textContent = TITLES[id]; cleanup = RENDER[id](body) || null; }
    else { const [name, color, text] = SOON[id]; titleEl.textContent = name; const ic = tiles.find((t) => t.dataset.open === id)?.querySelector(".ic")?.innerHTML || ""; body.innerHTML = `<div class="soon"><div><div class="ic ${color}">${ic}</div><b>${name}</b><p>${text}${id === "hilfe" ? "" : " Im Prototyp noch ohne Inhalt."}</p></div></div>`; }
    barTitle.textContent = titleEl.textContent;
    home.classList.add("away"); app.classList.add("open"); document.getElementById("back").focus();
  }
  function close() { if (cleanup) { cleanup(); cleanup = null; } app.classList.remove("open"); home.classList.remove("away"); barTitle.textContent = "Installierte Apps"; tiles[focus].focus(); }

  const RENDER = {
    fahrzeug(el) {
      const vin = "WBA5U1C0X0K•••••";
      el.innerHTML = `<div class="car"><div class="vin"><small>FAHRGESTELLNUMMER</small><div class="code">${[...vin].map((c, i) => `<span class="${i < 3 ? "w" : ""}">${c}</span>`).join("")}</div><small style="margin-top:.5em">BEISPIEL · DEMO</small></div>
        <div class="facts"><div class="fact"><small>Modell</small><b>3er Limousine</b></div><div class="fact"><small>Motor</small><b>Reihensechszylinder</b></div><div class="fact"><small>Getriebe</small><b>Automatik</b></div><div class="fact"><small>Antrieb</small><b>Hinterrad</b></div><div class="fact"><small>Werk</small><b>Beispielwert</b></div><div class="fact"><small>Baujahr</small><b>Beispielwert</b></div></div></div>`;
    },
    fehler(el) {
      const UNITS = [["DME","Motor (DME)","Motorelektronik"],["EGS","Getriebe (EGS)","Automatik"],["DSC","Fahrdynamik (DSC)","Stabilität / ABS"],["BDC","Karosserie (BDC)","Body Controller"],["HU","Headunit (MGU)","Infotainment"],["KOMBI","Kombiinstrument","Anzeige"],["FEM","Frontelektronik","Licht / Komfort"],["EPS","Lenkung (EPS)","Servolenkung"]];
      const DEMO = { DME: [["2C3A","crit","Zündaussetzer Zylinder 4 erkannt","aktuell","spontan"],["29DC","warn","Ladedruckregelung: Abweichung Sollwert","gespeichert","sporadisch"]], DSC: [["5F2B","warn","Raddrehzahlsensor hinten links: Signal unplausibel","gespeichert","sporadisch"]], BDC: [["A0B4","warn","Heckklappe: Taster klemmt","gespeichert","sporadisch"]] };
      el.innerHTML = `<div class="fs"><div class="units" id="u"></div><div class="codes"><div class="head"><h3>Fehlerspeicher</h3><div class="sum"><span class="c-c"><b id="nc">0</b>kritisch</span><span class="c-w"><b id="nw">0</b>Hinweis</span><span class="c-o"><b id="no">0</b>ok</span></div></div><div class="list" id="l"></div><div class="foot"><button class="pill" id="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Scan starten</button><button class="pill ghost" id="clr" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>Fehler löschen</button><span class="note">Nur lesen und löschen. Es wird nichts ins Fahrzeug geschrieben.</span></div></div></div>`;
      const uEl = el.querySelector("#u"), lEl = el.querySelector("#l"), scan = el.querySelector("#scan"), clr = el.querySelector("#clr");
      UNITS.forEach(([id, n, s]) => { const d = document.createElement("div"); d.className = "unit"; d.dataset.id = id; d.innerHTML = `<span class="dot"></span><span class="n">${n}<small>${s}</small></span><span class="c">–</span>`; uEl.appendChild(d); });
      let state = {}, scanning = false, dead = false;
      const empty = (done) => `<div class="empty"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.3 2.3 4.7-4.8"/></svg><p>${done ? "Keine Fehler gespeichert. Alles in Ordnung." : "Tippe „Scan starten“, um alle Steuergeräte zu lesen."}</p></div></div>`;
      function render() {
        const all = Object.entries(state).flatMap(([ecu, c]) => c.map((x) => ({ x, ecu })));
        el.querySelector("#nc").textContent = all.filter((a) => a.x[1] === "crit").length;
        el.querySelector("#nw").textContent = all.filter((a) => a.x[1] === "warn").length;
        el.querySelector("#no").textContent = UNITS.filter(([id]) => state[id] && state[id].length === 0).length;
        if (!all.length) { lEl.innerHTML = empty(Object.keys(state).length === UNITS.length); return; }
        all.sort((a, b) => (a.x[1] === "crit" ? -1 : 1) - (b.x[1] === "crit" ? -1 : 1));
        lEl.innerHTML = all.map(({ x, ecu }) => `<div class="code ${x[1]}"><span class="id">${x[0]}</span><span class="sev ${x[1]}">${x[1] === "crit" ? "KRITISCH" : "HINWEIS"}</span><span class="ecu">${ecu}</span><span class="desc">${x[2]}</span><span class="meta"><span>Status: ${x[3]}</span><span>Häufigkeit: ${x[4]}</span></span></div>`).join("");
      }
      render();
      async function doScan() {
        if (scanning) return; scanning = true; state = {}; scan.disabled = true; clr.disabled = true;
        uEl.querySelectorAll(".unit").forEach((u) => { u.className = "unit"; u.querySelector(".c").textContent = "–"; }); render();
        for (const [id] of UNITS) { if (dead) return; const u = uEl.querySelector(`[data-id="${id}"]`); u.classList.add("scan"); u.querySelector(".c").textContent = "…"; await wait(reduce.matches ? 60 : 300 + Math.random() * 240); const codes = DEMO[id] || []; state[id] = codes; u.classList.remove("scan"); u.classList.add(codes.length ? "fault" : "ok"); u.querySelector(".c").textContent = codes.length ? `${codes.length} ◆` : "✓"; render(); }
        scan.disabled = false; scan.lastChild.textContent = "Erneut scannen"; const n = Object.values(state).reduce((s, c) => s + c.length, 0); clr.disabled = n === 0; say(n ? `${n} Fehler gefunden.` : "Keine Fehler gefunden."); scanning = false;
      }
      async function doClear() {
        clr.disabled = true; say("Fehler werden gelöscht …");
        for (const [id] of UNITS) { if (dead) return; if (state[id] && state[id].length) { await wait(reduce.matches ? 40 : 240); state[id] = []; const u = uEl.querySelector(`[data-id="${id}"]`); u.classList.remove("fault"); u.classList.add("ok"); u.querySelector(".c").textContent = "✓"; render(); } }
        say("Fehlerspeicher gelöscht. Nach der Fahrt erneut prüfen.");
      }
      scan.addEventListener("click", doScan); clr.addEventListener("click", doClear);
      return () => { dead = true; };
    },
    mv(el) {
      el.innerHTML = `<div class="mv"><div><h3>Zündaussetzer je Zylinder<span class="s">pro 1000 Zündungen</span></h3><div class="bars" id="b"></div></div><div><h3>Motorwerte live<span class="s">Reihensechszylinder</span></h3><div class="pgrid" id="p"></div></div></div>`;
      const bEl = el.querySelector("#b"), pEl = el.querySelector("#p");
      for (let i = 1; i <= 6; i++) { const r = document.createElement("div"); r.className = "crow"; r.innerHTML = `<span class="lab">Zyl ${i}</span><span class="track"><span class="fill"></span></span><span class="v">0</span>`; bEl.appendChild(r); }
      const crows = [...bEl.children];
      const PARAMS = [["boost","Ladedruck","bar",0.9,0.7,2,2.2],["rail","Raildruck (TNVD)","bar",11000,2500,0,20000],["intake","Ansauglufttemp.","°C",34,6,0,80],["oil","Öltemperatur","°C",104,4,0,150],["iat","Abgastemperatur","°C",620,90,0,950],["turbo","Turbodrehzahl","×1000",110,35,0,200]];
      const hist = {};
      PARAMS.forEach(([k, name, unit]) => { hist[k] = []; const d = document.createElement("div"); d.className = "p"; d.dataset.k = k; d.innerHTML = `<small>${name}</small><div class="row"><b>–</b><u>${unit}</u></div><svg class="spark" viewBox="0 0 100 16" preserveAspectRatio="none"><path d=""/></svg>`; pEl.appendChild(d); });
      let raf = 0, t0 = performance.now(), misfireAt = 5;
      function frame(now) {
        const t = (now - t0) / 1000, burst = t > misfireAt && t < misfireAt + 6;
        crows.forEach((r, i) => { let mf = Math.max(0, Math.round(Math.sin(t * 2 + i) * 0.5 + (Math.random() < 0.04 ? 2 : 0))); if (burst && i === 3) mf = 14 + Math.round(Math.sin(t * 6) * 4 + Math.random() * 3); r.classList.toggle("hot", mf >= 8); r.querySelector(".fill").style.width = Math.min(100, mf / 20 * 100) + "%"; r.querySelector(".v").textContent = mf; });
        PARAMS.forEach(([k, n, u, base, amp, dec, max], idx) => { const val = base + Math.sin(t * (0.8 + idx * 0.3)) * amp + Math.sin(t * 3 + idx) * amp * 0.3; const d = pEl.querySelector(`[data-k="${k}"]`); d.querySelector("b").textContent = dec ? val.toFixed(dec).replace(".", ",") : Math.round(val).toLocaleString("de-DE"); const h = hist[k]; h.push(Math.max(0, Math.min(1, val / max))); if (h.length > 40) h.shift(); d.querySelector("path").setAttribute("d", "M" + h.map((y, i2) => `${i2 / 39 * 100},${16 - y * 14}`).join(" L")); });
        if (!reduce.matches) raf = requestAnimationFrame(frame);
      }
      raf = requestAnimationFrame(frame);
      return () => cancelAnimationFrame(raf);
    },
    live(el) {
      const G = [["oel","Öltemperatur","°C",40,150,98,3,"#009ada",0],["lade","Ladedruck","bar",0,2,0.9,0.55,"#1c69d4",2],["kuehl","Kühlmittel","°C",40,130,92,2,"#2b3990",0],["bat","Batterie","V",10,16,14.2,0.15,"#e7222e",1]];
      const ARC = 2 * Math.PI * 40 * 0.75;
      el.innerHTML = `<div class="gauges">${G.map(([k, n, u, mn, mx]) => `<div class="gauge"><svg viewBox="0 0 100 100"><g transform="rotate(135 50 50)"><circle class="track" cx="50" cy="50" r="40" stroke-dasharray="${ARC} 999"/><circle class="val" id="g-${k}" cx="50" cy="50" r="40" stroke-dasharray="${ARC} 999" stroke-dashoffset="${ARC}"/></g><text x="50" y="54" id="t-${k}">–</text><text class="u" x="50" y="66">${u}</text></svg><b>${n}</b><small>${mn}–${mx} ${u}</small></div>`).join("")}</div>`;
      G.forEach(([k,,,,,,,col]) => el.querySelector(`#g-${k}`).setAttribute("stroke", col));
      let raf = 0; const start = performance.now();
      function step(now) { const t = (now - start) / 1000; G.forEach(([k, n, u, mn, mx, base, amp,, dec], i) => { const val = base + Math.sin(t * (0.9 + i * 0.35) + i) * amp + Math.sin(t * 3.1 + i * 2) * amp * 0.25; const p = Math.max(0, Math.min(1, (val - mn) / (mx - mn))); el.querySelector(`#g-${k}`).setAttribute("stroke-dashoffset", (ARC * (1 - p)).toFixed(1)); el.querySelector(`#t-${k}`).textContent = val.toFixed(dec).replace(".", ","); }); if (!reduce.matches) raf = requestAnimationFrame(step); }
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    },
    drag(el) {
      el.innerHTML = `<div class="drag"><div><span class="state" id="st">BEREIT</span><div class="nums" style="margin-top:.3em"><div><b id="tm">0.00</b><small>Sekunden</small></div><div><b id="sp">0</b><small>km/h</small></div></div><div class="bar2"><i id="bar"></i></div><div class="btns"><button class="pill" id="go">Demo-Lauf starten</button><button class="pill ghost" id="rs">Zurücksetzen</button></div></div>
        <table><tbody><tr><td>0–60 km/h</td><td id="s60">–</td></tr><tr><td>0–100 km/h</td><td id="s100">–</td></tr><tr><td>100–200 km/h</td><td id="s200">–</td></tr><tr><td>Höchstwert</td><td id="smax">–</td></tr></tbody></table></div>`;
      const q = (id) => el.querySelector("#" + id); let raf = 0, t0 = 0, sp = {};
      const v = (t) => 300 * (1 - Math.exp(-t / 10.5));
      function reset() { cancelAnimationFrame(raf); sp = {}; q("st").textContent = "BEREIT"; q("tm").textContent = "0.00"; q("sp").textContent = "0"; q("bar").style.width = "0"; ["s60","s100","s200","smax"].forEach((k) => q(k).textContent = "–"); }
      function run() { reset(); q("st").textContent = "LÄUFT"; t0 = performance.now(); const step = (now) => { const t = (now - t0) / 1000, s = v(t); q("tm").textContent = t.toFixed(2); q("sp").textContent = Math.round(s); q("bar").style.width = Math.min(100, s / 2) + "%"; if (s >= 60 && !sp[60]) { sp[60] = t; q("s60").textContent = t.toFixed(2) + " s"; } if (s >= 100 && !sp[100]) { sp[100] = t; q("s100").textContent = t.toFixed(2) + " s"; } if (t < 6.2) raf = requestAnimationFrame(step); else { q("st").textContent = "FERTIG"; q("smax").textContent = Math.round(s) + " km/h"; q("s200").textContent = "nicht erreicht"; } }; raf = requestAnimationFrame(step); }
      q("go").addEventListener("click", run); q("rs").addEventListener("click", reset);
      return () => cancelAnimationFrame(raf);
    },
  };

  tiles.forEach((t, i) => { t.addEventListener("click", () => { setFocus(i); open(t.dataset.open, t); }); t.addEventListener("mouseenter", () => setFocus(i)); });
  document.querySelectorAll(".side button[data-open]").forEach((b) => b.addEventListener("click", () => open(b.dataset.open, b)));
  document.getElementById("back").addEventListener("click", close);
  addEventListener("keydown", (e) => {
    if (app.classList.contains("open")) { if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); close(); } return; }
    const map = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: 6, ArrowUp: -6 };
    if (map[e.key] !== undefined) { e.preventDefault(); setFocus(focus + map[e.key]); tiles[focus].focus(); }
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(tiles[focus].dataset.open, tiles[focus]); }
  });
  setFocus(0);
})();
</script>
</body>
</html>
