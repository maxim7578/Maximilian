<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BimmerVision Code-Eingabe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Prototyp der E-Mail-Code-Eingabe im BimmerVision-Design: Felder fliegen nach der letzten Ziffer in einen Orbit, drehen während der Prüfung und werden zum Haken. */
:root {
  color-scheme: dark;
  --bg: #05070d; --fg: #f8fafc; --muted: #94a3b8; --soft: #cbd5e1;
  --m-light: #009ada; --m-dark: #2b3990; --m-blue: #1c69d4; --m-red: #e7222e; --m-text: #5ec8f2;
  --ok: #22c55e; --ok-soft: rgb(34 197 94 / 18%);
  --glass: rgb(255 255 255 / 7%); --edge: rgb(255 255 255 / 13%);
  --cta: linear-gradient(90deg, #009ada, #1c69d4, #2b3990);
  --f-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--fg); font: 400 16px/1.5 var(--f-sans); -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(60% 40% at 100% 0%, rgb(0 154 218 / 30%), transparent 70%),
    radial-gradient(55% 40% at 0% 100%, rgb(231 34 46 / 16%), transparent 70%),
    linear-gradient(180deg, #05070d, #0a0f1e 50%, #070a14);
  display: grid; place-items: center;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.shell { width: 100%; max-width: 440px; display: grid; gap: 18px; }
.brand { display: grid; justify-items: center; gap: 10px; text-align: center; }
.brand img { width: 64px; height: 64px; filter: drop-shadow(0 0 14px rgb(0 154 218 / 40%)); }
.brand b { font-size: 1.5rem; font-weight: 700; }
.v { color: var(--m-text); }
.m-stripe { display: inline-flex; width: 96px; height: 4px; transform: skewX(-20deg); }
.m-stripe i { flex: 1; }
.m-stripe i:nth-child(1) { background: var(--m-light); } .m-stripe i:nth-child(2) { background: var(--m-dark); } .m-stripe i:nth-child(3) { background: var(--m-red); }
.brand p { margin: 0; font-size: .85rem; color: var(--muted); }

.card {
  position: relative; overflow: hidden; padding: 26px 22px 22px; border-radius: 24px;
  background: var(--glass); border: 1px solid var(--edge);
  box-shadow: 0 1px 0 rgb(255 255 255 / 6%) inset, 0 14px 34px -16px rgb(0 0 0 / 70%);
  backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
  display: grid; gap: 6px; text-align: center;
}
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--m-light) 0 33.3%, var(--m-dark) 33.3% 66.6%, var(--m-red) 66.6%); }
.card h1 { margin: 6px 0 0; font-size: 1.3rem; font-weight: 700; transition: color .4s ease; }
.card .sub { margin: 0; font-size: .9rem; color: var(--muted); min-height: 2.8em; }
.card.ok h1 { color: var(--ok); }

.arena { position: relative; height: 230px; display: grid; place-items: center; margin-block: 6px; }
.ring { position: absolute; width: 190px; height: 190px; opacity: 0; pointer-events: none; overflow: visible; }
.ring circle { fill: none; stroke: var(--m-light); stroke-width: 1.5; stroke-dasharray: 2 8; vector-effect: non-scaling-stroke; }
.hub { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--m-text); box-shadow: 0 0 12px var(--m-light); opacity: 0; }
.slots { position: relative; display: flex; gap: 8px; }
.slot {
  width: 42px; height: 54px; border-radius: 14px; display: grid; place-items: center;
  font: 600 1.5rem/1 var(--f-mono); color: #fff;
  background: rgb(11 18 32 / 60%); border: 1px solid rgb(0 154 218 / 30%);
  box-shadow: 0 2px 8px rgb(0 0 0 / 18%) inset;
  transition: border-color .25s ease, box-shadow .25s ease, background-color .35s ease, color .35s ease;
  will-change: transform;
}
.slot.active { border-color: var(--m-light); box-shadow: 0 0 0 3px rgb(0 154 218 / 22%), 0 0 18px -4px var(--m-light); }
.slot.active:empty::after { content: ""; width: 2px; height: 26px; background: var(--m-text); animation: caret 1s steps(1) infinite; }
.slot.filled { border-color: rgb(255 255 255 / 30%); }
.slot.green { border-color: var(--ok); background: var(--ok-soft); color: #dcfce7; box-shadow: 0 0 16px -4px var(--ok); }
.slot.red { border-color: var(--m-red); background: rgb(231 34 46 / 16%); }
@keyframes caret { 50% { opacity: 0; } }
.code-input {
  position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; background: transparent;
  color: transparent; caret-color: transparent; font-size: 16px; cursor: text;
}
.code-input:disabled { cursor: default; }
.badge {
  position: absolute; width: 74px; height: 74px; border-radius: 22px; display: grid; place-items: center;
  border: 2px solid var(--ok); background: var(--ok-soft); box-shadow: 0 0 32px -6px var(--ok), inset 0 0 18px rgb(34 197 94 / 20%);
  opacity: 0; transform: scale(.4);
}
.badge svg { width: 34px; height: 34px; }
.badge path { stroke-dasharray: 40; stroke-dashoffset: 40; }
.spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); opacity: 0; }

.msg { margin: 0; min-height: 1.5em; font-size: .9rem; color: var(--m-text); }
.msg.err { color: #ff8a90; }
.btn {
  min-height: 46px; border-radius: 999px; border: 0; font: 600 .95rem/1 var(--f-sans); color: #fff; cursor: pointer;
  background: var(--cta); box-shadow: 0 8px 22px -8px rgb(0 154 218 / 60%);
}
.btn:disabled { opacity: .5; cursor: default; }
.btn.glass { background: var(--glass); border: 1px solid rgb(255 255 255 / 14%); box-shadow: none; }
.resend { font-size: .85rem; color: var(--muted); }

.demo {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px;
  background: rgb(13 19 36 / 82%); border: 1px solid var(--edge); text-align: left;
}
.demo .ic { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgb(0 154 218 / 16%); color: var(--m-text); }
.demo .ic svg { width: 18px; height: 18px; }
.demo small { display: block; font: 600 .66rem/1.3 var(--f-mono); letter-spacing: .1em; color: var(--muted); }
.demo span { font-size: .9rem; }
.demo b { font-family: var(--f-mono); letter-spacing: .08em; color: var(--m-text); }
.demo .btn { min-height: 34px; padding: 0 14px; margin-left: auto; font-size: .82rem; }
.toggle { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: .82rem; color: var(--muted); }
.toggle input { accent-color: var(--m-red); }
.note { margin: 0; text-align: center; font-size: .78rem; color: #64748b; }
:focus-visible { outline: 2px solid var(--m-light); outline-offset: 3px; }
.arena:focus-within .slot.active { border-color: var(--m-text); }
@media (max-width: 380px) { .slot { width: 38px; height: 50px; font-size: 1.3rem; } .slots { gap: 6px; } }
</style>
</head>
<body>
<main class="shell">
  <div class="brand">
    <img src="img/bimmervision.svg" alt="" width="64" height="64">
    <b>Bimmer<span class="v">Vision</span></b>
    <span class="m-stripe" aria-hidden="true"><i></i><i></i><i></i></span>
    <p>Anmeldung bestätigen</p>
  </div>

  <section class="card" id="card" aria-labelledby="title">
    <h1 id="title">E-Mail-Code</h1>
    <p class="sub" id="sub">Wir haben dir einen 6-stelligen Code an v•••@gmail.com geschickt.</p>

    <div class="arena" id="arena">
      <svg class="ring" id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49"/></svg>
      <span class="hub" id="hub" aria-hidden="true"></span>
      <div class="slots" id="slots" aria-hidden="true"></div>
      <label for="code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Anmeldecode, 6 Ziffern</label>
      <input class="code-input" id="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus>
      <div class="badge" id="badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    </div>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>
    <button class="btn glass" id="resend" type="button" disabled>Code erneut senden (60 s)</button>
  </section>

  <div class="demo" aria-label="Demo">
    <span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 8l9 6 9-6"/></svg></span>
    <span><small>E-MAIL · DEMO</small><b>482917</b> ist dein Anmeldecode.</span>
    <button class="btn" id="fill" type="button">Einfügen</button>
  </div>
  <label class="toggle"><input type="checkbox" id="fail"> Falschen Code simulieren</label>
  <p class="note">Prototyp: Hier wird nichts geprüft oder verschickt. Die Prüfung dauert zum Zeigen 1,6 Sekunden.</p>
</main>

<script>
(() => {
  const LEN = 6;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const card = document.getElementById("card");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  const arena = document.getElementById("arena");
  const slotsEl = document.getElementById("slots");
  const input = document.getElementById("code");
  const ring = document.getElementById("ring");
  const hub = document.getElementById("hub");
  const badge = document.getElementById("badge");
  const msg = document.getElementById("msg");
  const resend = document.getElementById("resend");
  const fill = document.getElementById("fill");
  const fail = document.getElementById("fail");

  const slots = Array.from({ length: LEN }, () => { const s = document.createElement("div"); s.className = "slot"; slotsEl.appendChild(s); return s; });
  let busy = false;
  const EASE_OUT = "cubic-bezier(.2,.8,.2,1)";
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  function render() {
    const v = input.value;
    slots.forEach((s, i) => {
      s.textContent = v[i] ?? "";
      s.classList.toggle("filled", i < v.length);
      s.classList.toggle("active", !busy && i === Math.min(v.length, LEN - 1) && document.activeElement === input);
    });
  }

  // Simulierte Server-Prüfung; in der App ist das confirmEmailLoginCode
  function verify(code) {
    return wait(1600).then(() => (fail.checked ? "incorrect" : "verified"));
  }

  // Position jedes Feldes relativ zur Mitte der Arena
  function offsets() {
    const a = arena.getBoundingClientRect();
    const cx = a.left + a.width / 2, cy = a.top + a.height / 2;
    return slots.map((s) => { const r = s.getBoundingClientRect(); return { x: r.left + r.width / 2 - cx, y: r.top + r.height / 2 - cy }; });
  }
  function orbitPoint(i, radius, turn) {
    const a = -Math.PI / 2 + (i / LEN) * Math.PI * 2 + turn;
    return { x: Math.cos(a) * radius, y: Math.sin(a) * radius };
  }

  async function submit() {
    if (busy || input.value.length !== LEN) return;
    busy = true; input.disabled = true; msg.textContent = ""; msg.classList.remove("err"); render();
    const code = input.value;
    const result = verify(code);
    if (reduce.matches) return finish(await result);

    const from = offsets();
    const R = 86;
    // 1) Felder fliegen in den Orbit
    ring.animate([{ opacity: 0, transform: "scale(.6) rotate(-90deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }], { duration: 600, easing: EASE_OUT, fill: "forwards" });
    hub.animate([{ opacity: 0, transform: "scale(0)" }, { opacity: 1, transform: "scale(1)" }], { duration: 400, delay: 250, fill: "forwards" });
    await Promise.all(slots.map((s, i) => {
      const p = orbitPoint(i, R, 0);
      return s.animate([
        { transform: "translate(0,0) rotate(0deg) scale(1)" },
        { transform: `translate(${p.x - from[i].x}px, ${p.y - from[i].y}px) rotate(${(i % 2 ? 1 : -1) * 8}deg) scale(.9)` },
      ], { duration: 620, delay: i * 45, easing: EASE_OUT, fill: "forwards" }).finished;
    }));

    // 2) Drehen, bis der Server antwortet (mindestens eine Runde)
    let spinning = true, turn = 0, speed = 0, last = performance.now();
    let outcome = null;
    result.then((r) => { outcome = r; });
    await new Promise((done) => {
      function tick(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const target = outcome && turn > Math.PI * 2 ? 0 : 7;
        speed += (target - speed) * Math.min(1, dt * (outcome ? 3.2 : 4));
        turn += speed * dt;
        slots.forEach((s, i) => {
          const p = orbitPoint(i, R, turn);
          const tilt = Math.sin(turn * 2 + i) * 14 * Math.min(1, speed / 7);
          s.getAnimations().forEach((a) => a.cancel());
          s.style.transform = `translate(${p.x - from[i].x}px, ${p.y - from[i].y}px) rotate(${tilt}deg) scale(.9)`;
        });
        ring.style.transform = `rotate(${turn * 57.3 * 0.5}deg)`;
        if (outcome && speed < 0.15 && turn > Math.PI * 2) { spinning = false; return done(); }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
    const finalTurn = turn;

    if (outcome === "verified") {
      // 3a) Grün färben, in die Mitte ziehen, Haken mit Funken
      for (let i = 0; i < LEN; i++) { slots[i].classList.add("green"); await wait(70); }
      ring.querySelector("circle").style.stroke = "var(--ok)";
      await wait(220);
      await Promise.all(slots.map((s, i) => {
        const p = orbitPoint(i, R, finalTurn);
        return s.animate([
          { transform: `translate(${p.x - from[i].x}px, ${p.y - from[i].y}px) scale(.9)`, opacity: 1 },
          { transform: `translate(${-from[i].x}px, ${-from[i].y}px) scale(.2)`, opacity: 0 },
        ], { duration: 420, delay: i * 25, easing: "cubic-bezier(.6,0,.4,1)", fill: "forwards" }).finished;
      }));
      ring.animate([{ opacity: 1, transform: getComputedStyle(ring).transform }, { opacity: 0, transform: "scale(1.4)" }], { duration: 500, fill: "forwards" });
      hub.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
      badge.animate([{ opacity: 0, transform: "scale(.4) rotate(-12deg)" }, { opacity: 1, transform: "scale(1.08) rotate(0deg)", offset: .7 }, { opacity: 1, transform: "scale(1) rotate(0deg)" }], { duration: 520, easing: EASE_OUT, fill: "forwards" });
      badge.querySelector("path").animate([{ strokeDashoffset: 40 }, { strokeDashoffset: 0 }], { duration: 420, delay: 260, easing: "ease-out", fill: "forwards" });
      burst();
      return finish("verified");
    }

    // 3b) Falsch: rot blinken, zurück in die Reihe, wackeln, leeren
    ring.querySelector("circle").style.stroke = "var(--m-red)";
    slots.forEach((s) => s.classList.add("red"));
    await wait(250);
    await Promise.all(slots.map((s, i) => {
      const p = orbitPoint(i, R, finalTurn);
      s.style.transform = "";
      return s.animate([
        { transform: `translate(${p.x - from[i].x}px, ${p.y - from[i].y}px) scale(.9)` },
        { transform: "translate(0,0) scale(1)" },
      ], { duration: 520, delay: i * 30, easing: EASE_OUT }).finished;
    }));
    ring.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" });
    hub.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 200, fill: "forwards" });
    await slotsEl.animate([{ transform: "translateX(0)" }, { transform: "translateX(-10px)" }, { transform: "translateX(9px)" }, { transform: "translateX(-6px)" }, { transform: "translateX(3px)" }, { transform: "translateX(0)" }], { duration: 420, easing: "ease-out" }).finished;
    return finish("incorrect");
  }

  function burst() {
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("span"); s.className = "spark"; arena.appendChild(s);
      const a = (i / 22) * Math.PI * 2 + Math.random() * 0.3, d = 70 + Math.random() * 50;
      s.animate([
        { opacity: 1, transform: "translate(0,0) scale(1)" },
        { opacity: 0, transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(.3)` },
      ], { duration: 700 + Math.random() * 400, delay: 200, easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards" }).finished.then(() => s.remove());
    }
  }

  function finish(result) {
    if (result === "verified") {
      card.classList.add("ok");
      title.textContent = "Code bestätigt";
      sub.textContent = "Du wirst angemeldet …";
      if (reduce.matches) { badge.style.opacity = 1; badge.style.transform = "none"; badge.querySelector("path").style.strokeDashoffset = 0; slotsEl.style.visibility = "hidden"; }
      resend.hidden = true;
      return;
    }
    slots.forEach((s) => { s.classList.remove("red"); s.style.transform = ""; s.getAnimations().forEach((a) => a.cancel()); });
    ring.querySelector("circle").style.stroke = "";
    ring.style.transform = "";
    msg.textContent = "Der Code ist falsch. Bitte versuche es erneut.";
    msg.classList.add("err");
    input.value = ""; busy = false; input.disabled = false; input.focus(); render();
  }

  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, LEN);
    msg.textContent = ""; msg.classList.remove("err");
    render();
    if (input.value.length === LEN) submit();
  });
  ["focus", "blur", "keyup", "click"].forEach((ev) => input.addEventListener(ev, render));
  fill.addEventListener("click", async () => {
    if (busy) return;
    input.value = ""; input.focus();
    for (const d of "482917") { input.value += d; render(); await wait(reduce.matches ? 0 : 140); }
    submit();
  });

  // Countdown für "Code erneut senden"
  let left = 60;
  const t = setInterval(() => {
    left -= 1;
    if (left <= 0) { clearInterval(t); resend.disabled = false; resend.textContent = "Code erneut senden"; return; }
    resend.textContent = `Code erneut senden (${left} s)`;
  }, 1000);
  resend.addEventListener("click", () => { msg.classList.remove("err"); msg.textContent = "Neuer Code ist unterwegs (Demo)."; });

  render();
})();
</script>
</body>
</html>
